services:
  # 🐘 База данных
  db:
    image: postgres:17                 # готовый образ Postgres с Docker Hub
    env_file: .env                     # берёт POSTGRES_DB, USER, PASSWORD
    volumes:
      - pgdata:/var/lib/postgresql/data   # 📀 «флешка» с данными
    healthcheck:                       # как понять, что база уже готова
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # 🌐 Наш сайт
  web:
    build: .                           # собрать образ из Dockerfile в этой папке
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy     # не стартовать, пока база не готова
    restart: unless-stopped            # если упал, перезапустить

volumes:
  pgdata:                              # объявляем volume
