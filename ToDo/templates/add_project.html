{% extends "base.html" %}

{% block title %}Новый проект{% endblock %}

{% block content %}
<div class="form-card anim">
  <div class="form-icon"><i class="bi bi-folder-plus"></i></div>
  <h1 class="text-center">Новый проект</h1>

  <form method="POST" class="form-card-form" novalidate>
    {% csrf_token %}
    {% include "partials/form_fields.html" %}

    <div class="d-flex align-items-center gap-2 mt-4">
      <button type="submit" class="btn-save"><i class="bi bi-check-lg"></i> Создать</button>
      <a href="{% url 'todo_app:projects' %}" class="btn-cancel">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
