{% extends "base.html" %}

{% block title %}Задача в «{{ project.name }}»{% endblock %}

{% block content %}
<div class="form-card anim">
  <div class="form-icon"><i class="bi bi-folder2-open"></i></div>
  <h1 class="text-center mb-1">Новая задача</h1>
  <p class="text-center mb-4" style="color: var(--muted); font-weight: 600;">
    в проекте «{{ project.name }}»
  </p>

  <form method="POST" class="form-card-form" novalidate>
    {% csrf_token %}
    {% include "partials/form_fields.html" %}

    <div class="d-flex align-items-center gap-2 mt-4">
      <button type="submit" class="btn-save"><i class="bi bi-check-lg"></i> Создать</button>
      <a href="{% url 'todo_app:taskprojects' project.id %}" class="btn-cancel">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
