{% extends "base.html" %}

{% block title %}Tasks{% endblock %}

{% block content %}

<style>
  .page-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
  }
  .page-head h1 {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--deep);
    margin: 0;
  }
  .page-head .count {
    background: var(--deep);
    color: var(--check);
    font-weight: 700;
    font-size: .85rem;
    padding: .3rem .8rem;
    border-radius: 999px;
  }

  .task-card {
    display: flex;
    align-items: center;
    gap: .9rem;
    background: #fff;
    border: 1px solid #dfe9e5;
    border-radius: 12px;
    padding: .9rem 1.1rem;
    margin-bottom: .75rem;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .task-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(14, 43, 42, .1);
  }
  .task-check {
    width: 1.6rem;
    height: 1.6rem;
    flex-shrink: 0;
    border: 2px solid var(--deep-soft);
    border-radius: 50%;
  }
  .task-text {
    font-weight: 600;
    color: var(--deep);
    flex-grow: 1;
  }

  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    background: #fff;
    border: 2px dashed #c5d8d2;
    border-radius: 14px;
    color: var(--deep-soft);
  }
  .empty-state i {
    font-size: 2.5rem;
    color: var(--check);
    background: var(--deep);
    width: 4rem;
    height: 4rem;
    border-radius: 50%;
    display: inline-grid;
    place-items: center;
    margin-bottom: .75rem;
  }
  .button_delete {
    margin-left:auto;

  }
</style>

<div class="page-head">
  <h1>Мои задачи</h1>
  <span class="count">{{ tasks|length }}</span>
</div>

{% for task in tasks %}
  <div class="task-card">
    <span class="task-check"></span>
    <div class="task-body">
      <span class="task-text">{{ task }}</span>
      <small class="task-date">
        <i class="bi bi-clock"></i> {{ task.date_added|date:"d.m.Y H:i" }}
      </small>
    </div>
    <div class = "button_delete">
      <form method="post" action="{% url 'todo_app:delete_task' task.id %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary">Удалить задачу</button>
      </form>
    </div>
  </div>
{% empty %}
{% endfor %}

{% endblock %}
