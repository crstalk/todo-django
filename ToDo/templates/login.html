{% extends 'base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="form-card narrow anim">
    <div class="form-icon"><i class="bi bi-check-lg"></i></div>
    <h1 class="text-center mb-1">С возвращением!</h1>
    <p class="text-center mb-4" style="color: var(--muted); font-weight: 600;">Войдите, чтобы увидеть свои задачи</p>

    <form method="POST" class="form-card-form" novalidate>
      {% csrf_token %}
      {% include "partials/form_fields.html" %}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn-save w-100 mt-2">Войти <i class="bi bi-arrow-right"></i></button>
    </form>

    <p class="form-foot mb-0">Нет аккаунта? <a href="{% url 'user_auth:signup' %}">Зарегистрироваться</a></p>
  </div>
</div>
{% endblock %}
