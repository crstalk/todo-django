{% extends 'base.html' %}

{% block title %}Смена пароля{% endblock %}

{% block content %}
<div class="form-card narrow anim">
  <div class="form-icon"><i class="bi bi-key"></i></div>
  <h1 class="text-center">Смена пароля</h1>

  <form method="POST" class="form-card-form" novalidate>
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <div class="d-flex align-items-center gap-2 mt-4">
      <button type="submit" class="btn-save"><i class="bi bi-check-lg"></i> Сменить пароль</button>
      <a href="{% url 'todo_app:profile' %}" class="btn-cancel">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
