{% extends "base.html" %}

{% block title %}Мои задачи{% endblock %}

{% block content %}
<style>
    /* ---------- Шапка ---------- */
    .page-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.25rem;
    }
    .page-head h1 {
        font-size: 1.6rem;
        font-weight: 800;
        color: var(--deep);
        margin: 0;
    }
    .page-head .count {
        background: var(--deep);
        color: var(--check);
        font-weight: 700;
        font-size: .85rem;
        padding: .3rem .8rem;
        border-radius: 999px;
    }

    /* ---------- Карточка задачи ---------- */
    .task-item {
        display: flex;
        align-items: center;      /* всё на одной горизонтали */
        gap: .9rem;
        background: #fff;
        border: 2px solid #dfe9e5;
        border-radius: 12px;
        padding: .9rem 1.1rem;
        margin-bottom: .9rem;
        cursor: pointer;
        transition: transform .15s ease, box-shadow .15s ease;
    }
    .task-item:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(14, 43, 42, .1);
    }

    /* ---------- Кружок с галочкой ---------- */
    .task-check-input { display: none; }

    .task-check {
        width: 1.6rem;
        height: 1.6rem;
        flex-shrink: 0;
        border: 2px solid var(--deep-soft);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background .2s ease, border-color .2s ease;
    }

    /* сама галочка, по умолчанию скрыта */
    .task-check::after {
        content: "";
        width: .4rem;
        height: .8rem;
        border: solid #fff;
        border-width: 0 3px 3px 0;
        margin-top: -2px;
        transform: rotate(45deg) scale(0);
        transition: transform .2s ease;
    }

    /* состояние "выполнено" */
    .task-check-input:checked + .task-check {
        background: var(--deep);
        border-color: var(--deep);
    }
    .task-check-input:checked + .task-check::after {
        transform: rotate(45deg) scale(1);
    }
    .task-check-input:checked ~ .task-text {
        text-decoration: line-through;
        opacity: .5;
    }
</style>

<div class="page-head">
    <h1>Мои задачи</h1>
    <div class="d-flex align-items-center gap-2">
        <a href="{% url 'todo_app:addtaskproject' project.id %}" class="btn btn-primary">Add</a>
        <span class="count">{{ entries|length }}</span>
    </div>
</div>

{% for entry in entries %}
<form method="post" action="{% url 'todo_app:toggle' entry.id %}" class="task-item">
    {% csrf_token %}
    <input type="checkbox" class="task-check-input" id="t{{ entry.id }}"
           {% if entry.done %}checked{% endif %} onchange="this.form.submit()">
    <label for="t{{ entry.id }}" class="task-check"></label>
    <span class="task-text">{{ entry }}</span>
</form>
{% endfor %}

{% endblock %}
